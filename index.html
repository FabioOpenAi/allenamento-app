<html lang="it">
<head>
<meta charset="utf-8">

<style>
:root {
  --sfondo: #101418;
  --carta: #1a2128;
  --carta-2: #232c35;
  --testo: #f2f5f7;
  --testo-2: #a3afb9;
  --linea: #2f3a45;
  --accento: #2dd4bf;
  --accento-testo: #06231f;
  --ok: #34c759;
  --ok-testo: #04200c;
  --evid: #f0a050;
  --errore: #ff6b6b;
  --alto: env(safe-area-inset-top, 0px);
  --basso: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--sfondo); color: var(--testo); }
body {
  font: 18px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  overscroll-behavior: none;
}
#app { height: 100dvh; display: flex; flex-direction: column; }
h1, h2, h3, p { margin: 0; }
button, input, textarea { font: inherit; color: inherit; }

/* Pulsanti */
.btn {
  display: block; width: 100%; border: 0; border-radius: 16px;
  padding: 16px 18px; font-weight: 700; font-size: 19px; text-align: center;
  background: var(--carta-2); color: var(--testo); cursor: pointer;
}
.btn:active { transform: scale(.98); opacity: .9; }
.btn.primario { background: var(--accento); color: var(--accento-testo); }
.btn.ok { background: var(--ok); color: var(--ok-testo); }
.btn.piccolo { padding: 11px 14px; font-size: 16px; border-radius: 12px; }
.btn.testo { background: transparent; color: var(--testo-2); font-weight: 600; }
.btn[disabled] { opacity: .45; }
.fila { display: flex; gap: 10px; }
.fila > * { flex: 1; }

/* Home e schermate semplici */
.pagina { flex: 1; overflow-y: auto; padding: calc(var(--alto) + 22px) 18px calc(var(--basso) + 28px); display: flex; flex-direction: column; gap: 14px; }
.pagina h1 { font-size: 32px; letter-spacing: -.5px; }
.sotto { color: var(--testo-2); font-size: 16px; }
.carta { background: var(--carta); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.carta h2 { font-size: 22px; }
.etichetta { font-size: 13px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--testo-2); font-weight: 700; }
.avviso { background: #3a2a14; color: #ffd9a8; border-radius: 14px; padding: 12px 14px; font-size: 16px; }
.errore { background: #3d1c1c; color: #ffc4c4; border-radius: 14px; padding: 12px 14px; font-size: 16px; }
.infobox { background: var(--carta); border-radius: 16px; padding: 14px 16px; }
.infobox h3 { font-size: 17px; margin-bottom: 4px; color: var(--accento); }
.infobox p { font-size: 16px; color: var(--testo); }

/* Allenamento */
.barra { padding: calc(var(--alto) + 10px) 14px 8px; display: flex; align-items: center; gap: 10px; background: var(--sfondo); }
.barra .titolo { flex: 1; text-align: center; font-weight: 700; }
.barra .indietro { background: none; border: 0; color: var(--accento); font-weight: 700; font-size: 18px; padding: 8px 6px; min-width: 84px; text-align: left; }
.barra .contatore { min-width: 84px; text-align: right; color: var(--testo-2); font-variant-numeric: tabular-nums; }
.progresso { height: 4px; background: var(--linea); }
.progresso > div { height: 100%; width: 0; background: var(--accento); transition: width .25s; }
.scorri { flex: 1; min-height: 0; overflow-y: auto; scroll-snap-type: y mandatory; -webkit-overflow-scrolling: touch; }
.passo { min-height: 100%; scroll-snap-align: start; scroll-snap-stop: always; padding: 18px 16px calc(var(--basso) + 22px); display: flex; flex-direction: column; gap: 14px; }
.passo h2 { font-size: 28px; line-height: 1.15; letter-spacing: -.3px; }
.badge { align-self: flex-start; font-size: 13px; font-weight: 700; letter-spacing: .6px; padding: 5px 10px; border-radius: 999px; background: #3a2a14; color: var(--evid); }
.badge.video { background: #12312d; color: var(--accento); }
.tessere { display: flex; gap: 10px; flex-wrap: wrap; }
.tessera { flex: 1 1 28%; min-width: 96px; background: var(--carta); border-radius: 16px; padding: 12px 14px; }
.tessera .e { font-size: 12px; letter-spacing: 1.3px; color: var(--testo-2); font-weight: 700; }
.tessera .v { font-size: 24px; font-weight: 800; margin-top: 2px; line-height: 1.15; }
.tessera.evid { outline: 2px solid var(--evid); }
.nota { background: var(--carta); border-left: 4px solid var(--accento); border-radius: 12px; padding: 12px 14px; font-size: 17px; }
.campi { display: flex; gap: 10px; }
.campo { flex: 1; display: flex; flex-direction: column; gap: 5px; }
.campo label { font-size: 13px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--testo-2); font-weight: 700; }
.campo input, .campo textarea, .area {
  width: 100%; background: var(--carta); border: 2px solid var(--linea); border-radius: 14px;
  padding: 13px 14px; font-size: 19px; outline: none;
}
.campo input:focus, .campo textarea:focus, .area:focus { border-color: var(--accento); }
.campo textarea, .area { min-height: 84px; resize: none; font-size: 17px; }
.video-box { background: var(--carta); border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.video-box video { width: 100%; max-height: 38dvh; border-radius: 12px; background: #000; }
.spazio { flex: 1; min-height: 4px; }
.riepilogo { background: var(--carta); border-radius: 16px; padding: 14px 16px; white-space: pre-wrap; font-size: 15px; line-height: 1.45; max-height: 34dvh; overflow-y: auto; color: var(--testo-2); }
.fatto-sigillo { color: var(--ok); font-weight: 800; }

/* Registratore video */
.sovra { position: fixed; inset: 0; z-index: 50; background: #000; display: flex; flex-direction: column; }
.sovra video { flex: 1; min-height: 0; width: 100%; object-fit: contain; background: #000; }
.sovra .cima { position: absolute; top: 0; left: 0; right: 0; padding: calc(var(--alto) + 10px) 14px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; background: linear-gradient(#000a, #0000); }
.sovra .cima .nomeEs { font-weight: 700; font-size: 16px; text-shadow: 0 1px 4px #000; max-width: 62%; }
.sovra .fondo { padding: 14px 16px calc(var(--basso) + 18px); display: flex; flex-direction: column; gap: 10px; background: #000; }
.sovra .conto { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 150px; font-weight: 800; color: #fff; text-shadow: 0 2px 20px #000; pointer-events: none; z-index: 1; }
.sovra .tempo { position: absolute; top: calc(var(--alto) + 58px); left: 0; right: 0; text-align: center; z-index: 2; font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; }
.sovra .tempo span { background: #c0392b; padding: 4px 12px; border-radius: 999px; }
.sovra .msg { color: #cfd8df; font-size: 16px; text-align: center; }
.rec-btn { background: #e5484d; color: #fff; }
.nascosto { display: none !important; }
.nota.progressione { border-left-color: var(--evid); }
.nota .etichetta { margin-bottom: 4px; color: var(--evid); }
.originale { background: var(--carta); border-radius: 12px; padding: 10px 14px; font-size: 15px; color: var(--testo-2); }
.originale summary { cursor: pointer; font-weight: 600; }
.originale p { margin-top: 8px; font-style: italic; color: var(--testo); }
.scala { display: flex; gap: 10px; }
.scala-b { flex: 1; padding: 14px 0; border-radius: 14px; border: 2px solid var(--linea); background: var(--carta); font-weight: 800; font-size: 21px; cursor: pointer; }
.scala-b.sel { background: var(--accento); color: var(--accento-testo); border-color: var(--accento); }
.scala-leg { font-size: 13px; color: var(--testo-2); }
.sett-scelta { display: flex; flex-wrap: wrap; gap: 8px; }
.sett-scelta .btn { width: auto; flex: 1 0 56px; padding: 14px 0; font-size: 20px; }
.stepper { display: flex; align-items: center; gap: 12px; }
.stepper .btn { width: 64px; flex: none; font-size: 26px; padding: 8px 0; }
.stepper-v { flex: 1; text-align: center; font-size: 24px; font-weight: 800; }
.tabella-wrap { overflow: auto; border-radius: 14px; background: var(--carta); max-height: 56dvh; }
.tabella-wrap table { border-collapse: collapse; font-size: 14px; min-width: 700px; width: 100%; }
.tabella-wrap th, .tabella-wrap td { padding: 8px 10px; border-bottom: 1px solid var(--linea); text-align: left; vertical-align: top; }
.tabella-wrap td:nth-child(-n+3) { white-space: nowrap; }
.tabella-wrap th { position: sticky; top: 0; background: var(--carta-2); font-size: 12px; letter-spacing: .6px; text-transform: uppercase; }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(var(--basso) + 24px); z-index: 99; background: #f2f5f7; color: #101418; border-radius: 14px; padding: 14px 16px; font-weight: 600; text-align: center; box-shadow: 0 6px 24px #0008; }
</style>

<body>
<div id="app"></div>

<script src="link.js"></script>
<script>
'use strict';

/* =========================================================
   Strumenti di base
   ========================================================= */
function h(tag, props, ...figli) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'value') e.value = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else e.setAttribute(k, v);
  }
  for (const c of figli.flat()) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
const app = document.getElementById('app');
const coachNome = () => (stato.scheda && stato.scheda.allenatore) || '';
const coachDi = () => coachNome() ? 'di ' + coachNome() : "dell'allenatore";
const coachA = () => coachNome() ? 'a ' + coachNome() : "all'allenatore";
const coachPer = () => coachNome() ? 'per ' + coachNome() : "per l'allenatore";
const coachCon = () => coachNome() ? 'con ' + coachNome() : "con l'allenatore";
/* Settimane del programma: l'esercizio può cambiare serie, carico, note e progressione di settimana in settimana */
const haSettimane = () => !!(stato.scheda && (Number(stato.scheda.settimane) > 1 ||
  stato.scheda.giorni.some((g) => g.esercizi.some((e) => Array.isArray(e.settimane) && e.settimane.length > 1))));
const nSettimane = () => {
  const s = stato.scheda;
  const dalle = Math.max(1, ...s.giorni.flatMap((g) => g.esercizi.map((e) => (Array.isArray(e.settimane) ? e.settimane.length : 1))));
  return Math.max(Number(s.settimane) || 1, dalle);
};
const settSess = () => (stato.sess && stato.sess.settimana) || 1;
function datiEsercizio(es, sett) {
  const base = { serie_rep: es.serie_rep, carico: es.carico, rest: es.rest, nota: es.nota, progressione: es.progressione };
  const w = Array.isArray(es.settimane) ? es.settimane[sett - 1] : null;
  if (w == null) return base;
  if (typeof w === 'string') return { ...base, serie_rep: w };
  return { ...base, ...w };
}
const vuoto = (v) => !v || v === '–' || v === '-';

function toast(testo, ms = 3200) {
  const t = h('div', { class: 'toast', text: testo });
  document.body.append(t);
  setTimeout(() => t.remove(), ms);
  return t;
}

function slug(s) {
  return s.normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'esercizio';
}

/* =========================================================
   Archivio sul telefono (IndexedDB), con riserva in memoria
   ========================================================= */
const DB = {
  db: null,
  memoria: { kv: new Map(), video: new Map() },
  persistente: false,
  errore: false,
  async apriUnaVolta() {
    await new Promise((ok, ko) => {
      const r = indexedDB.open('allenamento', 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('video'); };
      r.onsuccess = () => { this.db = r.result; ok(); };
      r.onerror = () => ko(r.error);
      r.onblocked = () => ko(new Error('archivio bloccato'));
    });
    // prova di lettura: su iPhone l'archivio a volte si apre ma non risponde subito
    await this.tx('kv', 'readonly', (st) => st.get('scheda'));
  },
  /* Su iPhone, quando l'app parte dall'icona, l'archivio può non essere pronto al primo colpo:
     si riprova qualche volta prima di arrendersi. */
  async apri() {
    this.persistente = false; this.errore = false;
    if (!window.indexedDB) { this.errore = true; return; }
    for (let t = 0; t < 4; t++) {
      try {
        await this.apriUnaVolta();
        this.persistente = true;
        if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
        return;
      } catch (e) {
        try { if (this.db) this.db.close(); } catch (x) { /* ignora */ }
        this.db = null;
        await new Promise((r) => setTimeout(r, 400 * (t + 1)));
      }
    }
    this.errore = true;   // non riesce: l'app non deve far credere che i dati non esistano
  },
  tx(store, modo, fn) {
    return new Promise((ok, ko) => {
      const t = this.db.transaction(store, modo);
      const rq = fn(t.objectStore(store));
      t.oncomplete = () => ok(rq ? rq.result : undefined);
      t.onerror = () => ko(t.error);
      t.onabort = () => ko(t.error);
    });
  },
  async get(store, k) { return this.persistente ? this.tx(store, 'readonly', (s) => s.get(k)) : this.memoria[store].get(k); },
  async set(store, k, v) { return this.persistente ? this.tx(store, 'readwrite', (s) => s.put(v, k)) : void this.memoria[store].set(k, v); },
  async del(store, k) { return this.persistente ? this.tx(store, 'readwrite', (s) => s.delete(k)) : void this.memoria[store].delete(k); },
  async chiavi(store) { return this.persistente ? this.tx(store, 'readonly', (s) => s.getAllKeys()) : [...this.memoria[store].keys()]; }
};

/* =========================================================
   Stato dell'app
   ========================================================= */
const stato = {
  scheda: null,
  sess: null,            // allenamento in corso
  video: new Map(),      // indice esercizio -> { blob, tipo }
  storico: [],
  ultimoGiorno: null,
  corrente: 0,
  schermoAcceso: null,
  settimana: 1,          // settimana del programma in cui si trova l'atleta
  cicloFinito: false,    // la scheda è stata completata
  installaVisto: false,  // il suggerimento "metti l'app sulla Home" è già stato chiuso
  daLink: false,         // la scheda è arrivata da un link personale (in questa apertura)
  invio: null            // collegamento al bot Telegram dell'allenatore { t: codice del bot, c: chat, th: argomento }
};

let timerSalva = null;
function salvaSess() {
  clearTimeout(timerSalva);
  timerSalva = setTimeout(() => { DB.set('kv', 'sessione', stato.sess).catch(() => {}); }, 250);
}

const SEGNO_DATI = 'ac_haDati';   // piccolo segno: su questo telefono una scheda era già stata caricata
const segnoDati = (v) => { try { if (v) localStorage.setItem(SEGNO_DATI, '1'); else localStorage.removeItem(SEGNO_DATI); } catch (e) { /* ignora */ } };
const eraGiaUsata = () => { try { return localStorage.getItem(SEGNO_DATI) === '1'; } catch (e) { return false; } };

async function leggiArchivio() {
  stato.scheda = (await DB.get('kv', 'scheda')) || null;
  stato.sess = (await DB.get('kv', 'sessione')) || null;
  stato.storico = (await DB.get('kv', 'storico')) || [];
  stato.settimana = Number(await DB.get('kv', 'settimana')) || 1;
  stato.cicloFinito = !!(await DB.get('kv', 'cicloFinito'));
  stato.invio = (await DB.get('kv', 'invio')) || null;
  stato.installaVisto = !!(await DB.get('kv', 'installaVisto'));
  if (stato.scheda && stato.settimana > nSettimane()) stato.settimana = nSettimane();
  const ug = await DB.get('kv', 'ultimoGiorno');
  stato.ultimoGiorno = ug === undefined ? null : ug;
  if (stato.sess && stato.scheda) await caricaVideoSessione();
  else if (stato.sess) stato.sess = null;
}

/* Legge tutto dall'archivio del telefono. Se non ci riesce, o se l'archivio risulta vuoto ma l'app
   era già stata usata, lo dice (stato.problemaArchivio) invece di far credere che non ci sia nulla. */
async function caricaTutto() {
  stato.problemaArchivio = null;
  await DB.apri();
  if (DB.errore) { stato.problemaArchivio = 'lettura'; return; }
  let ok = false;
  for (let t = 0; t < 3 && !ok; t++) {
    try { await leggiArchivio(); ok = true; }
    catch (e) { await new Promise((r) => setTimeout(r, 500 * (t + 1))); }
  }
  if (!ok) { stato.problemaArchivio = 'lettura'; return; }
  if (stato.scheda) { segnoDati(true); return; }
  if (eraGiaUsata()) {   // niente scheda, ma qui era già stata caricata: ricontrolla con calma
    for (let t = 0; t < 2 && !stato.scheda; t++) {
      await new Promise((r) => setTimeout(r, 800));
      try { await leggiArchivio(); } catch (e) { /* ignora */ }
    }
    if (stato.scheda) segnoDati(true); else stato.problemaArchivio = 'vuoto';
  }
}

async function caricaVideoSessione() {
  stato.video.clear();
  const n = stato.scheda.giorni[stato.sess.giorno]?.esercizi.length || 0;
  for (let i = 0; i < n; i++) {
    try {
      const v = await DB.get('video', stato.sess.id + ':' + i);
      if (v && v.blob) stato.video.set(i, v);
    } catch (e) { /* ignora */ }
  }
}

/* Scheda di esempio per provare l'app: esercizi inventati, nessun dato personale */
const SCHEDA_ESEMPIO = {
  atleta: 'Prova',
  periodo: 'Scheda di esempio',
  settimane: 4,
  obiettivi: 'Scheda di prova per capire come funziona l\'app: scorri gli esercizi, registra un video e prepara il resoconto.',
  prima_di_iniziare: 'Questa è una scheda di esempio, non un programma di allenamento vero.',
  giorni: [
    { nome: 'Giorno 1', esercizi: [
      { nome: 'Riscaldamento a terra', serie_rep: '–', carico: '–', rest: '–', nota: 'Esercizio senza video: tocca "Fatto" e vai avanti.', video: false },
      { nome: 'Squat a corpo libero', serie_rep: '3 × 10-12', carico: '–', rest: '1\'', nota: 'Prova a filmare l\'ultima serie con il pulsante verde acqua.', video: true,
        progressione: 'Quando chiudi tutte le serie al massimo delle ripetizioni, la settimana dopo si aggiunge una serie.',
        settimane: ['3 × 10', '3 × 12', '4 × 10', '4 × 12'] },
      { nome: 'Panca con manubri', serie_rep: '3 × 8-10', carico: '12 kg', rest: '1\'30"', nota: 'Scrivi qui sotto quanti kg e ripetizioni hai fatto davvero.', video: true,
        settimane: [ { serie_rep: '3 × 8', carico: '12 kg' }, { serie_rep: '3 × 10', carico: '12 kg' },
          { serie_rep: '3 × 8', carico: '14 kg', progressione: 'Carico più alto: se perdi la tecnica, fermati e scrivilo nelle note.' }, { serie_rep: '3 × 10', carico: '14 kg' } ] },
      { nome: 'Rematore con elastico', serie_rep: '2 × 12', carico: '–', rest: '–', nota: '', video: true },
      { nome: 'Plank', serie_rep: '3 × 30"', carico: '–', rest: '40"', nota: 'Alla fine dell\'ultimo esercizio trovi il resoconto da inviare.', video: true }
    ] },
    { nome: 'Giorno 2', esercizi: [
      { nome: 'Riscaldamento a terra', serie_rep: '–', carico: '–', rest: '–', nota: '', video: false },
      { nome: 'Affondi', serie_rep: '3 × 8 x lato', carico: '–', rest: '1\'', nota: '', video: true },
      { nome: 'Trazioni con elastico', serie_rep: '3 × 6-8', carico: '–', rest: '1\'30"', nota: '', video: true },
      { nome: 'Ponte glutei', serie_rep: '2 × 12', carico: '–', rest: '–', nota: '', video: true }
    ] }
  ],
  info_utili: [
    { titolo: 'Video', testo: 'Filma l\'ultima serie di ogni esercizio. Il video parte dopo 5 secondi: appoggia il telefono e premi Ferma quando hai finito.' },
    { titolo: 'Settimane', testo: 'Il programma dura più settimane e alcuni esercizi cambiano: l\'app mostra quelli della settimana in cui sei. Passa alla successiva da sola quando chiudi l\'ultimo giorno.' },
    { titolo: 'Resoconto', testo: 'Segna i kg, le ripetizioni e il livello di fatica da 1 a 4: a fine allenamento l\'app prepara il riepilogo, e a fine scheda una tabella con tutti gli allenamenti.' }
  ]
};

/* =========================================================
   Scheda: caricamento da file
   ========================================================= */
function validaScheda(s) {
  if (!s || !Array.isArray(s.giorni) || !s.giorni.length) return 'Nel file non trovo i giorni di allenamento.';
  for (const g of s.giorni) {
    if (!g.nome || !Array.isArray(g.esercizi) || !g.esercizi.length) return 'Un giorno della scheda non ha esercizi.';
    for (const e of g.esercizi) if (!e.nome) return 'Un esercizio non ha il nome.';
  }
  return null;
}

async function applicaScheda(s) {
  stato.scheda = s;
  await DB.set('kv', 'scheda', s);
  segnoDati(true);
  // una scheda nuova chiude l'eventuale allenamento rimasto a metà della vecchia
  if (stato.sess) await eliminaSessione();
  stato.ultimoGiorno = null;
  await DB.set('kv', 'ultimoGiorno', null);
  stato.settimana = 1; stato.cicloFinito = false;
  await DB.set('kv', 'settimana', 1); await DB.set('kv', 'cicloFinito', false);
}

/* Link personale: la scheda (e il collegamento a Telegram) arrivano nel link, dopo il simbolo #.
   Se lo stesso link è già stato caricato non tocca i progressi; se è un link nuovo sostituisce la scheda. */
async function gestisciLinkPersonale() {
  const m = location.hash.match(/[#&]l=(AC2\.[A-Za-z0-9_-]+)/);
  if (!m) return null;
  if (!window.LinkScheda) throw new Error('Non riesco a leggere il link: ricarica la pagina.');
  if (stato.problemaArchivio === 'lettura') throw new Error('Non riesco a leggere i dati salvati: chiudi del tutto l\'app e riaprila, poi tocca di nuovo il link.');
  const id = window.LinkScheda.idPayload(m[1]);
  const giaCaricato = (await DB.get('kv', 'linkId').catch(() => null)) === id;
  if (giaCaricato && stato.scheda) return { gia: true };
  const { scheda, invio } = await window.LinkScheda.leggiPayload(m[1]);
  const err = validaScheda(scheda);
  if (err) throw new Error('La scheda nel link non è completa: ' + err + ' Chiedi un nuovo link.');
  if (stato.scheda && stato.sess && !confirm('Questo link contiene una scheda nuova. Se la carichi, l\'allenamento iniziato e non chiuso viene cancellato. Vuoi caricarla?')) return { saltato: true };
  const sostituita = !!stato.scheda;
  await applicaScheda(scheda);
  await DB.set('kv', 'linkId', id).catch(() => {});
  if (invio) { stato.invio = invio; await DB.set('kv', 'invio', invio).catch(() => {}); }
  stato.daLink = true;
  return { nuovo: true, sostituita, collegato: !!invio };
}

/* Se c'è un allenamento a metà, una scheda nuova lo cancella: va chiesto prima, sempre. */
function confermaSostituzione() {
  if (stato.problemaArchivio === 'lettura') { alert('Non riesco a leggere i dati salvati: non carico nulla, per non cancellarli. Chiudi del tutto l\'app e riaprila.'); return false; }
  if (stato.sess) return confirm('Hai un allenamento iniziato e non chiuso: se carichi una scheda nuova viene cancellato, con i video registrati. Vuoi caricarla lo stesso?');
  if (stato.scheda) return confirm('Carichi una scheda nuova al posto di quella attuale. I tuoi allenamenti passati restano. Vuoi continuare?');
  return true;
}

async function importaScheda(file, contenitoreErrore) {
  const nonValido = (testo) => contenitoreErrore.replaceChildren(h('div', { class: 'errore' },

    h('p', { text: 'Questa app legge solo il file di scheda nel suo formato (.json). Non può aprire direttamente un PDF, un Excel o un file Pages. Per provarla, usa la scheda di esempio.' })
  ));
  let s;
  try { s = JSON.parse(await file.text()); }
  catch (e) { return nonValido('Il file "' + (file.name || '') + '" non è una scheda per questa app.'); }
  const err = validaScheda(s);
  if (err) return nonValido('Il file "' + (file.name || '') + '" non è una scheda per questa app. ' + err);
  if (!confermaSostituzione()) return;
  await applicaScheda(s);
  toast('Scheda caricata');

}

function giornoProposto() {
  const n = stato.scheda.giorni.length;
  return stato.ultimoGiorno == null ? 0 : (stato.ultimoGiorno + 1) % n;

function dataLunga(iso) {
  return new Date(iso).toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

function testoResoconto() {
  const g = stato.scheda.giorni[stato.sess.giorno];
  const righe = [];
  righe.push(`Resoconto ${g.nome}${haSettimane() ? ' · Settimana ' + settSess() : ''} — ${dataLunga(stato.sess.inizio)}`);
  righe.push(stato.scheda.atleta || '');
  righe.push('');
  g.esercizi.forEach((es, i) => {
    const d = stato.sess.es[i];
    const ha = d.kg || d.rep || d.note || d.fatica;
    if (!d.fatto && !ha) { righe.push(`✗ ${es.nome} — non fatto`); return; }
    const parti = [];
    if (d.kg) parti.push('kg: ' + d.kg);
    if (d.rep) parti.push('rip: ' + d.rep);
    if (d.fatica) parti.push('fatica: ' + d.fatica + '/4');
    if (d.note) parti.push('note: ' + d.note);
    if (stato.video.has(i)) parti.push('video 🎥');
    righe.push(`✓ ${es.nome}${parti.length ? ' — ' + parti.join(' · ') : ''}`);
  });
  if (stato.sess.faticaGenerale) { righe.push(''); righe.push('Fatica generale dell\'allenamento: ' + stato.sess.faticaGenerale + '/4'); }
  if (stato.sess.finale.trim()) { righe.push(''); righe.push(coachPer().replace(/^p/, 'P') + ': ' + stato.sess.finale.trim()); }
  return righe.join('\n');
}

function estensione(tipo) {
  if (!tipo) return 'mp4';
  if (tipo.includes('mp4')) return 'mp4';
  if (tipo.includes('quicktime')) return 'mov';
  if (tipo.includes('webm')) return 'webm';
  return 'mp4';
}

function fileVideo(i) {
  const v = stato.video.get(i);
  if (!v) return null;
  const g = stato.scheda.giorni[stato.sess.giorno];
  const n = String(i + 1).padStart(2, '0');
  const data = stato.sess.inizio.slice(0, 10);
  const nome = `${slug(g.nome)}_${n}_${slug(g.esercizi[i].nome)}_${data}.${estensione(v.tipo)}`;
  return new File([v.blob], nome, { type: v.tipo || 'video/mp4' });
}

async function condividi({ files = [], text = '', title = '' }) {
  try {
    if (files.length && navigator.canShare && navigator.canShare({ files })) {
      await navigator.share({ files, text, title });
      return true;
    }
    if (!files.length && navigator.share) {
      await navigator.share({ text, title });
      return true;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return false;   // l'utente ha chiuso il foglio
  }
  // Se la condivisione non è disponibile: salva i file e copia il testo
  try { if (text && navigator.clipboard) await navigator.clipboard.writeText(text); } catch (e) { /* ignora */ }
  for (const f of files) {
    const url = URL.createObjectURL(f);
    const a = h('a', { href: url, download: f.name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  }
  toast('La condivisione non è disponibile qui: ho scaricato i file e copiato il testo.');
  return false;
}

/* =========================================================
   Invio automatico a Telegram
   L'allenatore crea un bot e genera un "codice di collegamento" con la pagina collega-bot.html;
   l'atleta lo incolla una volta nell'app. Da lì video e resoconto partono con un tocco, senza cercare la chat.
   ========================================================= */
function leggiCodice(testo) {
  try {
    const m = String(testo || '').match(/AC1\.([A-Za-z0-9_-]+)/);
    if (!m) return null;
    const o = JSON.parse(atob(m[1].replace(/-/g, '+').replace(/_/g, '/')));
    if (!/^\d{5,}:[A-Za-z0-9_-]{20,}$/.test(String(o.t || ''))) return null;
    if (!/^-?\d+$/.test(String(o.c))) return null;
    const th = o.th == null || o.th === '' ? null : Number(o.th);
    if (th !== null && !Number.isInteger(th)) return null;
    return { t: o.t, c: String(o.c), th };
  } catch (e) { return null; }
}

async function chiamaTelegram(metodo, campi) {
  const fd = new FormData();
  for (const [k, v] of Object.entries(campi)) { if (v != null) fd.append(k, v); }
  let r;
  try { r = await fetch(`https://api.telegram.org/bot${stato.invio.t}/${metodo}`, { method: 'POST', body: fd }); }
  catch (e) { throw new Error('Non riesco a collegarmi a Telegram: controlla la connessione e riprova.'); }
  let d = null;
  try { d = await r.json(); } catch (e) { /* risposta non leggibile */ }
  if (d && d.ok) return d.result;
  const cod = (d && d.error_code) || r.status;
  const desc = (d && d.description) || '';
  if (cod === 401 || cod === 404) throw new Error('Il collegamento non è più valido: chiedi un nuovo codice ' + coachA() + '.');
  if (cod === 429) throw new Error('Telegram chiede di aspettare un momento: riprova tra poco.');
  if (cod === 413 || /too big|too large/i.test(desc)) throw new Error('Il video è troppo grande per Telegram (massimo 50 MB).');
  throw new Error('Telegram non ha accettato l\'invio' + (desc ? ' (' + desc + ')' : '') + '. Avvisa ' + (coachNome() || 'l\'allenatore') + '.');
}

const campiBase = () => ({ chat_id: stato.invio.c, ...(stato.invio.th != null ? { message_thread_id: String(stato.invio.th) } : {}) });

function spezzaTesto(testo, max = 3800) {
  const out = []; let cur = '';
  for (const riga of String(testo).split('\n')) {
    if ((cur + '\n' + riga).length > max && cur) { out.push(cur); cur = riga; } else { cur = cur ? cur + '\n' + riga : riga; }
  }
  if (cur) out.push(cur);
  return out;
}

/* Manda il testo e poi i video; didascalie[k] è la didascalia del video k. */
async function inviaDiretto({ testo = '', files = [], didascalie = [], progresso = () => {} }) {
  const parti = testo ? spezzaTesto(testo) : [];
  const tot = parti.length + files.length;
  let n = 0;
  for (const p of parti) { progresso(`Invio ${++n} di ${tot}…`); await chiamaTelegram('sendMessage', { ...campiBase(), text: p }); }
  for (let k = 0; k < files.length; k++) {
    progresso(`Invio ${++n} di ${tot}…`);
    const f = files[k];
    const come = /webm/.test(f.type) ? 'sendDocument' : 'sendVideo';   // Telegram riconosce come video i file MPEG4
    await chiamaTelegram(come, { ...campiBase(), [come === 'sendVideo' ? 'video' : 'document']: f,
      caption: String(didascalie[k] || '').slice(0, 1000), ...(come === 'sendVideo' ? { supports_streaming: 'true' } : {}) });
  }
}

async function inviaConProgresso(btn, etichetta, opzioni) {
  btn.disabled = true;
  try {
    await inviaDiretto({ ...opzioni, progresso: (m) => { btn.textContent = m; } });
    toast('Inviato ' + coachA() + ' ✓', 4000);
    return true;
  } catch (e) {
    toast(e.message, 8000);
    return false;
  } finally { btn.disabled = false; btn.textContent = etichetta; }
}

}

          h('h2', { text: primaVolta ? 'Da quale settimana parti?' : `Sei alla settimana ${stato.settimana} di ${nSettimane()}` }),
          h('div', { class: 'sett-scelta' },
            numeri.map((n) => h('button', {
              class: 'btn' + (n === stato.settimana ? ' primario' : ''), type: 'button', text: String(n),
              'aria-pressed': n === stato.settimana ? 'true' : 'false', onclick: () => scegli(n)
            }))
          ),
          h('p', { class: 'sotto', text: primaVolta
            ? 'Tocca il numero della settimana in cui sei: se hai appena ricevuto la scheda, di solito è la 1.'
            : 'Passa alla successiva da sola quando chiudi l\'ultimo giorno. Se serve, cambiala qui.' })
        ));
      }
      const p = giornoProposto();
      const altri = s.giorni.map((g, i) => i).filter((i) => i !== p);
      pag.append(h('div', { class: 'carta' },
        h('span', { class: 'etichetta', text: stato.ultimoGiorno == null ? 'Si parte da qui' : 'Oggi tocca' }),
        h('h2', { text: s.giorni[p].nome }),
        h('p', { class: 'sotto', text: `${s.giorni[p].esercizi.length} esercizi` }),
        h('button', { class: 'btn primario', type: 'button', text: `Inizia ${s.giorni[p].nome}`, onclick: () => { nuovaSessione(p); vistaAllenamento(); } }),
        altri.map((i) => h('button', { class: 'btn testo piccolo', type: 'button', text: `Faccio invece ${s.giorni[i].nome}`, onclick: () => { nuovaSessione(i); vistaAllenamento(); } }))
      ));
    }

    if (stato.cicloFinito) {
      pag.append(h('div', { class: 'carta' },
        h('span', { class: 'etichetta', text: 'Scheda completata' }),
        h('h2', { text: 'Hai finito il programma' }),
        h('p', { class: 'sotto', text: 'Apri la tabella con tutti i tuoi allenamenti e mandala ' + coachA() + '.' }),
        h('button', { class: 'btn primario', type: 'button', text: 'Apri la tabella di riepilogo', onclick: vistaTabella }),
        h('button', { class: 'btn testo piccolo', type: 'button', text: 'Ricomincia dalla settimana 1', onclick: async () => {
          stato.cicloFinito = false; stato.settimana = 1;
          await DB.set('kv', 'cicloFinito', false).catch(() => {}); await DB.set('kv', 'settimana', 1).catch(() => {});
          vistaHome();
        } })
      ));
    }

    if (s.obiettivi) pag.append(h('div', { class: 'infobox' }, h('h3', { text: 'Obiettivi' }), h('p', { text: s.obiettivi })));

    pag.append(h('button', { class: 'btn', type: 'button', text: 'Info utili ' + coachDi(), onclick: vistaInfo }));
    pag.append(h('button', { class: 'btn', type: 'button', text: `Allenamenti passati (${stato.storico.length})`, onclick: vistaStorico }));
    pag.append(selettoreScheda('Carica una scheda nuova', 'testo piccolo', errori), errori);
  }

  if (!stato.sess) {
    pag.append(h('button', { class: 'btn', type: 'button', text: stato.invio ? 'Invio automatico: collegato ✓' : 'Collega l\'invio automatico', onclick: vistaCollega }));
  }

  app.replaceChildren(pag);
}

/* Tabella di riepilogo: tutti gli allenamenti chiusi, una riga per esercizio */
const INTESTAZIONE_TABELLA = ['Data', 'Settimana', 'Giorno', 'Esercizio', 'Previsto', 'Kg fatti', 'Ripetizioni', 'Fatica (1-4)', 'Note'];
function righeTabella() {
  const out = [];
  [...stato.storico].reverse().forEach((r) => {
    const data = new Date(r.data).toLocaleDateString('it-IT');
    (r.righe || []).forEach((x) => out.push([data, r.settimana || '', r.giorno, x.esercizio, x.previsto || '', x.kg || '', x.rep || '', x.fatica || '', x.note || '']));
    if (r.faticaGenerale || (r.finale || '').trim()) out.push([data, r.settimana || '', r.giorno, 'Allenamento nel complesso', '', '', '', r.faticaGenerale || '', (r.finale || '').trim()]);
  });
  return out;
}
const csvCella = (v) => { const t = String(v ?? ''); return /[;"\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
function testoCsv() { return '\ufeff' + [INTESTAZIONE_TABELLA, ...righeTabella()].map((r) => r.map(csvCella).join(';')).join('\r\n'); }
function testoTsv() { return [INTESTAZIONE_TABELLA, ...righeTabella()].map((r) => r.map((c) => String(c ?? '').replace(/[\t\r\n]+/g, ' ')).join('\t')).join('\n'); }

function vistaTabella() {
  stato.vista = 'tabella';
  const righe = righeTabella();
  const pag = h('div', { class: 'pagina' });
  if (!righe.length) {
    pag.append(h('p', { class: 'sotto', text: 'La tabella si riempie man mano che chiudi gli allenamenti.' }));
  } else {
    pag.append(h('p', { class: 'sotto', text: `${stato.storico.length} allenamenti, ${righe.length} righe. Scorri a destra per vedere tutte le colonne.` }));
    pag.append(h('div', { class: 'tabella-wrap' }, h('table', {},
      h('thead', {}, h('tr', {}, INTESTAZIONE_TABELLA.map((t) => h('th', { text: t })))),
      h('tbody', {}, righe.map((r) => h('tr', {}, r.map((c) => h('td', { text: String(c) })))))
    )));
    pag.append(h('button', { class: 'btn primario', type: 'button', text: 'Invia il file ' + coachA(), onclick: async () => {
      const nome = `riepilogo-scheda_${slug(stato.scheda.atleta || 'atleta')}_${new Date().toISOString().slice(0, 10)}.csv`;
      await condividi({ files: [new File([testoCsv()], nome, { type: 'text/csv' })], text: 'Riepilogo della scheda', title: 'Riepilogo della scheda' });
    } }));
    pag.append(h('button', { class: 'btn', type: 'button', text: 'Copia la tabella (da incollare in Fogli o Excel)', onclick: async () => {
      try { await navigator.clipboard.writeText(testoTsv()); toast('Tabella copiata'); } catch (e) { toast('Non sono riuscito a copiare.'); }
    } }));
  }
  app.replaceChildren(barraSemplice('Riepilogo scheda'), pag);
}

/* =========================================================
   Schermata: Allenamento (un esercizio per volta)
   ========================================================= */
function vistaAllenamento() {
  stato.vista = 'allenamento';
  schermoAcceso(true);
  const g = stato.scheda.giorni[stato.sess.giorno];
  const tot = g.esercizi.length;

  const contatore = h('div', { class: 'contatore', text: `1 / ${tot}` });
  const barraProg = h('div', {});
  const scorri = h('div', { class: 'scorri' });

  g.esercizi.forEach((es, i) => scorri.append(creaPasso(i)));
  scorri.append(creaFine());

  app.replaceChildren(
    h('div', { class: 'barra' },
      h('button', { class: 'indietro', type: 'button', text: '‹ Esci', onclick: vistaHome }),
      h('div', { class: 'titolo', text: g.nome + (haSettimane() ? ' · Sett. ' + settSess() : '') }),
      contatore
    ),
    h('div', { class: 'progresso' }, barraProg),
    scorri
  );

  const aggiorna = (i) => {
    stato.corrente = i;
    contatore.textContent = i >= tot ? 'Fine' : `${i + 1} / ${tot}`;
    barraProg.style.width = Math.min(100, (stato.sess.es.filter((x) => x.fatto).length / tot) * 100) + '%';
  };
  aggiorna(Math.min(stato.corrente, tot));

  const passi = [...scorri.children];
  const osserva = new IntersectionObserver((voci) => {
    voci.forEach((v) => { if (v.isIntersecting) aggiorna(passi.indexOf(v.target)); });
  }, { root: scorri, threshold: 0.6 });
  passi.forEach((p) => osserva.observe(p));
  scorri._aggiorna = () => aggiorna(stato.corrente);

  // torna all'esercizio in cui eri
  requestAnimationFrame(() => { const p = passi[Math.min(stato.corrente, passi.length - 1)]; if (p) scorri.scrollTop = p.offsetTop; });
}

function vaiAvanti(da) {
  const scorri = document.querySelector('.scorri');
  const passi = [...scorri.children];
  const p = passi[da + 1];
  if (p) scorri.scrollTo({ top: p.offsetTop, behavior: 'smooth' });
}

function aggiornaProgresso() {
  const scorri = document.querySelector('.scorri');
  if (scorri && scorri._aggiorna) scorri._aggiorna();
}

function creaPasso(i) {
  const g = stato.scheda.giorni[stato.sess.giorno];
  const es = g.esercizi[i];
  const d = stato.sess.es[i];
  const passo = h('section', { class: 'passo', 'data-i': i });

  const ds = datiEsercizio(es, settSess());
  passo.append(h('h2', { text: es.nome }));
  if (haSettimane()) passo.append(h('span', { class: 'badge video', text: 'SETTIMANA ' + settSess() + ' DI ' + nSettimane() }));

  const tessere = [];
  if (!vuoto(ds.serie_rep)) tessere.push(h('div', { class: 'tessera' }, h('div', { class: 'e', text: 'SERIE × REP' }), h('div', { class: 'v', text: ds.serie_rep })));
  if (!vuoto(ds.carico)) tessere.push(h('div', { class: 'tessera' }, h('div', { class: 'e', text: 'CARICO' }), h('div', { class: 'v', text: ds.carico })));
  if (!vuoto(ds.rest)) tessere.push(h('div', { class: 'tessera' }, h('div', { class: 'e', text: 'RECUPERO' }), h('div', { class: 'v', text: ds.rest })));
  if (tessere.length) passo.append(h('div', { class: 'tessere' }, tessere));
  if (ds.nota) passo.append(h('div', { class: 'nota', text: ds.nota }));
  if (ds.progressione) passo.append(h('div', { class: 'nota progressione' }, h('div', { class: 'etichetta', text: 'Come progredire' }), ds.progressione));

  if (es.originale) passo.append(h('details', { class: 'originale' }, h('summary', { text: 'Come è scritto nella scheda originale' }), h('p', { text: es.originale })));

  if (es.video) passo.append(creaBloccoVideo(i, passo));

  // Dati da riportare nel resoconto: solo dove ha senso
  if (es.video || !vuoto(ds.carico) || !vuoto(ds.serie_rep)) {
    passo.append(h('div', { class: 'campi' },
      h('div', { class: 'campo' },
        h('label', { text: 'Kg fatti' }),
        h('input', { type: 'text', inputmode: 'decimal', placeholder: 'es. 70', value: d.kg, oninput: (e) => { d.kg = e.target.value; salvaSess(); } })
      ),
      h('div', { class: 'campo' },
        h('label', { text: 'Ripetizioni' }),
        h('input', { type: 'text', placeholder: 'es. 8, 8, 7', value: d.rep, oninput: (e) => { d.rep = e.target.value; salvaSess(); } })
      )
    ));
    passo.append(creaFatica(d.fatica || 0, (v) => { d.fatica = v; salvaSess(); }, 'Fatica'));
    passo.append(h('div', { class: 'campo' },
      h('label', { text: 'Note o fastidi (facoltativo)' }),
      h('input', { type: 'text', placeholder: 'es. fastidio alla spalla', value: d.note, oninput: (e) => { d.note = e.target.value; salvaSess(); } })
    ));
  }

  passo.append(h('div', { class: 'spazio' }));

  const pulsanteFatto = h('button', { class: 'btn ok', type: 'button' });
  const salta = h('button', { class: 'btn testo piccolo', type: 'button', text: 'Salta questo esercizio', onclick: () => vaiAvanti(i) });
  const disegna = () => {
    pulsanteFatto.textContent = d.fatto ? '✓ Fatto — avanti' : 'Fatto — avanti';
    salta.classList.toggle('nascosto', d.fatto);
  };
  pulsanteFatto.addEventListener('click', () => {
    d.fatto = true; disegna(); salvaSess(); aggiornaProgresso(); vaiAvanti(i);
  });
  disegna();
  passo.append(pulsanteFatto, salta);
  return passo;
}

function creaFatica(valore, alCambio, etichetta) {
  const riga = h('div', { class: 'scala' });
  const disegna = () => {
    riga.replaceChildren(...[1, 2, 3, 4].map((n) => h('button', {
      type: 'button', class: 'scala-b' + (valore === n ? ' sel' : ''), text: String(n),
      onclick: () => { valore = valore === n ? 0 : n; alCambio(valore); disegna(); }
    })));
  };
  disegna();
  return h('div', { class: 'campo' }, h('label', { text: etichetta }), riga, h('div', { class: 'scala-leg', text: '1 = leggera · 4 = al limite' }));
}

function creaBloccoVideo(i, passo) {
  const box = h('div', { class: 'video-box' });
  const disegna = () => {
    box.replaceChildren();
    const v = stato.video.get(i);
    if (!v) {
      box.append(
        h('button', { class: 'btn primario', type: 'button', text: '🎥 Filma l\'ultima serie', onclick: () => apriRegistratore(i, disegna) })
      );
    } else {
      const url = URL.createObjectURL(v.blob);
      const el = h('video', { src: url, controls: true, playsinline: true, preload: 'metadata' });
      el.addEventListener('loadedmetadata', () => { /* pronto */ });
      box.append(
        h('span', { class: 'fatto-sigillo', text: '✓ Video pronto' }),
        el,
        h('div', { class: 'fila' },
          h('button', { class: 'btn piccolo', type: 'button', text: 'Rifai', onclick: () => apriRegistratore(i, disegna) }),
          h('button', { class: 'btn piccolo primario', type: 'button', text: 'Invia ' + coachA(), onclick: () => inviaUnVideo(i) })
        )
      );
    }
  };
  disegna();
  return box;
}

async function inviaUnVideo(i) {
  const f = fileVideo(i);
  if (!f) return;
  const g = stato.scheda.giorni[stato.sess.giorno];
  if (stato.invio) {
    const t = toast('Invio del video…', 120000);
    try { await inviaDiretto({ files: [f], didascalie: [didascaliaVideo(i)] }); t.remove(); toast('Video inviato ' + coachA() + ' ✓', 4000); }
    catch (e) { t.remove(); toast(e.message, 8000); }
    return;
  }
  await condividi({ files: [f], text: `${g.nome} — ${g.esercizi[i].nome}`, title: g.esercizi[i].nome });
}

function creaFine() {
  const g = stato.scheda.giorni[stato.sess.giorno];
  const passo = h('section', { class: 'passo', 'data-i': 'fine' });
  const riepilogo = h('div', { class: 'riepilogo' });
  const info = h('p', { class: 'sotto' });
  const aggiorna = () => {
    riepilogo.textContent = testoResoconto();
    const nf = stato.sess.es.filter((x) => x.fatto).length;
    info.textContent = `Esercizi fatti: ${nf} su ${g.esercizi.length} · Video pronti: ${stato.video.size}`;
  };
  passo._aggiorna = aggiorna;
  aggiorna();

  const finale = h('textarea', {
    class: 'area', placeholder: 'Un messaggio ' + coachPer() + ' (sensazioni, fastidi, domande)…', value: stato.sess.finale,
    oninput: (e) => { stato.sess.finale = e.target.value; salvaSess(); riepilogo.textContent = testoResoconto(); }
  });

  const filesDelGiorno = () => {
    const files = [];
    for (const i of [...stato.video.keys()].sort((a, b) => a - b)) { const f = fileVideo(i); if (f) files.push(f); }
    return files;
  };
  const etichettaInvio = 'Invia video e resoconto ' + coachA();
  const bInvia = h('button', { class: 'btn primario', type: 'button', text: etichettaInvio, onclick: async () => {
    aggiorna();
    const files = [];
    const didascalie = [];
    for (const i of [...stato.video.keys()].sort((a, b) => a - b)) { const f = fileVideo(i); if (f) { files.push(f); didascalie.push(didascaliaVideo(i)); } }
    if (stato.invio) { await inviaConProgresso(bInvia, etichettaInvio, { testo: testoResoconto(), files, didascalie }); return; }
    await condividi({ files, text: testoResoconto(), title: 'Resoconto ' + g.nome });
  } });

  passo.append(
    h('h2', { text: 'Allenamento finito' }),
    info,
    creaFatica(stato.sess.faticaGenerale || 0, (v) => { stato.sess.faticaGenerale = v; salvaSess(); riepilogo.textContent = testoResoconto(); }, 'Come ti sei sentito oggi?'),
    finale,
    h('div', { class: 'etichetta', text: 'Anteprima del resoconto' }),
    riepilogo,
    h('div', { class: 'spazio' }),
    bInvia,
    stato.invio
      ? h('p', { class: 'sotto', text: 'Parte direttamente ' + coachA() + ' su Telegram. Se non riesce, riprova oppure usa "Invia con un\'altra app".' })
      : h('p', { class: 'sotto', text: 'Si apre il foglio di condivisione: scegli Telegram e poi la chat ' + coachDi() + '. Se il testo non compare, usa "Copia resoconto" e incollalo nella chat.' }),
    h('div', { class: 'fila' },
      h('button', { class: 'btn piccolo', type: 'button', text: 'Copia resoconto', onclick: () => { aggiorna(); copiaTesto(testoResoconto()); } }),
      stato.invio
        ? h('button', { class: 'btn piccolo', type: 'button', text: 'Invia con un\'altra app', onclick: async () => { aggiorna(); await condividi({ files: filesDelGiorno(), text: testoResoconto(), title: 'Resoconto ' + g.nome }); } })
        : h('button', { class: 'btn piccolo', type: 'button', text: 'Solo testo ' + coachA(), onclick: () => condividi({ text: testoResoconto(), title: 'Resoconto ' + g.nome }) })
    ),
    h('button', { class: 'btn ok', type: 'button', text: 'Ho inviato tutto: chiudi l\'allenamento', onclick: chiudiAllenamento })
  );
  // quando la sezione "fine" torna visibile aggiorna i numeri
  const obs = new IntersectionObserver((voci) => { if (voci.some((v) => v.isIntersecting)) aggiorna(); }, { threshold: 0.3 });
  setTimeout(() => obs.observe(passo), 0);
  return passo;
}

async function chiudiAllenamento() {
  const g = stato.scheda.giorni[stato.sess.giorno];
  const nv = stato.video.size;
  const msg = nv
    ? `Chiudo l'allenamento? I ${nv} video registrati vengono cancellati dal telefono. Assicurati di averli inviati ${coachA()}.`
    : 'Chiudo l\'allenamento?';
  if (!confirm(msg)) return;
  const righeTab = g.esercizi.map((es, i) => {
    const d = stato.sess.es[i];
    const ds = datiEsercizio(es, settSess());
    return { esercizio: es.nome, previsto: [ds.serie_rep, ds.carico].filter((x) => !vuoto(x)).join(' · '),
      kg: d.kg || '', rep: d.rep || '', fatica: d.fatica || 0, note: d.note || '', fatto: !!d.fatto, video: stato.video.has(i) };
  }).filter((r) => r.fatto || r.kg || r.rep || r.fatica || r.note);
  stato.storico.unshift({ id: stato.sess.id, giorno: g.nome, settimana: haSettimane() ? settSess() : 0, data: stato.sess.inizio,
    testo: testoResoconto(), righe: righeTab, faticaGenerale: stato.sess.faticaGenerale || 0, finale: stato.sess.finale || '' });
  stato.storico = stato.storico.slice(0, 200);
  stato.ultimoGiorno = stato.sess.giorno;
  // finito l'ultimo giorno della settimana: si passa alla settimana dopo (o la scheda è completata)
  let messaggio = 'Allenamento chiuso. Bel lavoro!';
  if (haSettimane() && stato.sess.giorno === stato.scheda.giorni.length - 1) {
    if (settSess() >= nSettimane()) { stato.cicloFinito = true; await DB.set('kv', 'cicloFinito', true).catch(() => {}); messaggio = 'Scheda completata! Apri il riepilogo e mandalo ' + coachA() + '.'; }
    else { stato.settimana = settSess() + 1; await DB.set('kv', 'settimana', stato.settimana).catch(() => {}); messaggio = 'Allenamento chiuso. Ora sei alla settimana ' + stato.settimana + '.'; }
  }
  await DB.set('kv', 'storico', stato.storico).catch(() => {});
  await DB.set('kv', 'ultimoGiorno', stato.ultimoGiorno).catch(() => {});
  await eliminaSessione();
  toast(messaggio, 4500);
  vistaHome();
}

/* =========================================================
   Registratore video
   ========================================================= */
function tipoSupportato() {
  if (!window.MediaRecorder) return '';
  const prove = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  return prove.find((t) => MediaRecorder.isTypeSupported(t)) || '';
}

async function salvaVideo(i, blob, tipo) {
  stato.video.set(i, { blob, tipo: tipo || blob.type || 'video/mp4' });
  try { await DB.set('video', stato.sess.id + ':' + i, stato.video.get(i)); }
  catch (e) { toast('Video non salvato sul telefono: invialo subito.'); }
}

function apriRegistratore(i, alTermine) {
  const g = stato.scheda.giorni[stato.sess.giorno];
  const es = g.esercizi[i];
  let stream = null, rec = null, pezzi = [], facing = 'environment';
  let intervallo = null, inizioRec = 0, blobPronto = null, tipoPronto = '';
  const MAX = 90;

  const sovra = h('div', { class: 'sovra' });
  document.body.append(sovra);

  const chiudi = () => {
    clearInterval(intervallo);
    try { if (rec && rec.state !== 'inactive') { rec.onstop = null; rec.stop(); } } catch (e) { /* ignora */ }
    if (stream) stream.getTracks().forEach((t) => t.stop());
    sovra.remove();
  };

  const inputSistema = (cattura) => h('input', {
    type: 'file', accept: 'video/*', class: 'nascosto', ...(cattura ? { capture: 'environment' } : {}),
    onchange: async (e) => { const f = e.target.files[0]; if (f) { await salvaVideo(i, f, f.type); chiudi(); alTermine(); } }
  });

  const apriFotocamera = async () => {
    if (stream) stream.getTracks().forEach((t) => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: true
    });
  };

  const schermataPronto = async (errore) => {
    clearInterval(intervallo);
    sovra.replaceChildren();
    const cima = h('div', { class: 'cima' },
      h('div', { class: 'nomeEs', text: es.nome }),
      h('button', { class: 'btn piccolo', type: 'button', style: 'width:auto', text: 'Chiudi', onclick: chiudi })
    );
    const supporto = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
    const sis1 = inputSistema(true), sis2 = inputSistema(false);

    if (!supporto || errore) {
      sovra.append(cima, h('div', { style: 'flex:1' }),
        h('div', { class: 'fondo' },
          h('p', { class: 'msg', text: errore ? 'Non riesco ad aprire la fotocamera dall\'app. Controlla in Impostazioni che il permesso sia attivo, oppure usa la fotocamera del telefono.' : 'La registrazione dentro l\'app non è disponibile: usa la fotocamera del telefono.' }),
          h('button', { class: 'btn primario', type: 'button', text: 'Apri la fotocamera del telefono', onclick: () => sis1.click() }),
          h('button', { class: 'btn', type: 'button', text: 'Scegli un video già girato', onclick: () => sis2.click() }),
          sis1, sis2
        ));
      return;
    }

    try { await apriFotocamera(); }
    catch (e) { return schermataPronto(true); }

    const anteprima = h('video', { muted: true, playsinline: true, autoplay: true });
    anteprima.srcObject = stream;
    anteprima.muted = true;
    if (facing === 'user') anteprima.style.transform = 'scaleX(-1)';

    const conto = h('div', { class: 'conto nascosto' });
    const tempo = h('div', { class: 'tempo nascosto' }, h('span', { text: '● 0:00' }));
    const fondo = h('div', { class: 'fondo' });

    const mostraPronto = () => {
      fondo.replaceChildren(
        h('p', { class: 'msg', text: 'Appoggia il telefono, poi parti. Filma solo l\'ultima serie.' }),
        h('button', { class: 'btn rec-btn', type: 'button', text: '● Parti tra 5 secondi', onclick: () => avvia(5) }),
        h('div', { class: 'fila' },
          h('button', { class: 'btn piccolo', type: 'button', text: 'Parti subito', onclick: () => avvia(0) }),
          h('button', { class: 'btn piccolo', type: 'button', text: 'Gira camera', onclick: async () => { facing = facing === 'environment' ? 'user' : 'environment'; schermataPronto(); } })
        ),
        h('button', { class: 'btn testo piccolo', type: 'button', text: 'Uso la fotocamera del telefono', onclick: () => sis1.click() }),
        sis1, sis2
      );
    };

    const avvia = (secondi) => {
      let resto = secondi;
      const parti = () => {
        conto.classList.add('nascosto');
        const tipo = tipoSupportato();
        pezzi = [];
        try { rec = new MediaRecorder(stream, { ...(tipo ? { mimeType: tipo } : {}), videoBitsPerSecond: 2500000 }); }
        catch (e) { rec = new MediaRecorder(stream); }
        rec.ondataavailable = (ev) => { if (ev.data && ev.data.size) pezzi.push(ev.data); };
        rec.onstop = () => {
          clearInterval(intervallo);
          tipoPronto = rec.mimeType || tipo || 'video/mp4';
          blobPronto = new Blob(pezzi, { type: tipoPronto });
          if (stream) stream.getTracks().forEach((t) => t.stop());
          schermataRivedi();
        };
        rec.start(1000);
        inizioRec = Date.now();
        tempo.classList.remove('nascosto');
        intervallo = setInterval(() => {
          const s = Math.floor((Date.now() - inizioRec) / 1000);
          tempo.firstChild.textContent = `● ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
          if (s >= MAX && rec.state === 'recording') rec.stop();
        }, 250);
        fondo.replaceChildren(
          h('button', { class: 'btn rec-btn', type: 'button', text: '■ Ferma', onclick: () => { if (rec.state === 'recording') rec.stop(); } })
        );
      };
      if (secondi === 0) return parti();
      conto.classList.remove('nascosto');
      conto.textContent = resto;
      fondo.replaceChildren(h('button', { class: 'btn', type: 'button', text: 'Annulla', onclick: () => { clearInterval(intervallo); conto.classList.add('nascosto'); mostraPronto(); } }));
      intervallo = setInterval(() => {
        resto -= 1;
        if (resto <= 0) { clearInterval(intervallo); parti(); } else conto.textContent = resto;
      }, 1000);
    };

    sovra.replaceChildren(cima, anteprima, conto, tempo, fondo);
    mostraPronto();
  };

  const schermataRivedi = () => {
    const url = URL.createObjectURL(blobPronto);
    sovra.replaceChildren(
      h('div', { class: 'cima' }, h('div', { class: 'nomeEs', text: es.nome }), h('span')),
      h('video', { src: url, controls: true, playsinline: true, autoplay: true }),
      h('div', { class: 'fondo' },
        h('p', { class: 'msg', text: 'Guardalo: se va bene, tienilo.' }),
        h('button', { class: 'btn primario', type: 'button', text: 'Tieni questo video', onclick: async () => {
          await salvaVideo(i, blobPronto, tipoPronto); URL.revokeObjectURL(url); chiudi(); alTermine();
        } }),
        h('button', { class: 'btn', type: 'button', text: 'Rifai', onclick: () => { URL.revokeObjectURL(url); schermataPronto(); } })
      )
    );
  };

  schermataPronto();
}

(async () => {
  try { await caricaTutto(); } catch (e) { /* si parte comunque */ }
  let collegatoOra = false;
  try {
    const m = location.hash.match(/collega=(AC1\.[A-Za-z0-9_-]+)/);
    if (m) {
      const o = leggiCodice(m[1]);
      if (o) { stato.invio = o; await DB.set('kv', 'invio', o).catch(() => {}); collegatoOra = true; }
      history.replaceState(null, '', location.pathname + location.search);
    }
  } catch (e) { /* ignora */ }
  const caricaDaLink = async (avvio) => {
    let esitoLink = null;
    try { esitoLink = await gestisciLinkPersonale(); }
    catch (e) { esitoLink = { errore: e.message }; }
    if (avvio || !stato.sess || (esitoLink && esitoLink.nuovo)) vistaHome();
    if (esitoLink && esitoLink.nuovo) toast((esitoLink.sostituita ? 'Scheda nuova caricata ✓' : 'Scheda caricata ✓') + (esitoLink.collegato ? ' Invio automatico collegato ✓' : ''), 5000);
    if (esitoLink && esitoLink.errore) toast(esitoLink.errore, 9000);
  };
  await caricaDaLink(true);
  if (collegatoOra) toast('Invio automatico collegato ✓', 4500);
  // l'app è già aperta e viene toccato un link nuovo: si aggiorna da sola
  window.addEventListener('hashchange', () => { if (/[#&]l=AC2\./.test(location.hash)) caricaDaLink(); });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
